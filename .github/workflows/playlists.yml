name: Playlists

# Каждый день плейлисты tv.m3u, music.m3u, muzyka.m3u и kino.m3u собираются заново из свежего списка iptv-org.
# Нерабочие и медленные каналы убираются. Адреса плейлистов не меняются.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch iptv-org
        run: |
          git clone -q --depth 1 https://github.com/iptv-org/iptv /tmp/iptv
          git clone -q --depth 1 https://github.com/iptv-org/database /tmp/database
      - name: Build playlists
        run: python3 tools/build_playlists.py /tmp/iptv/streams /tmp/database/data .
      - name: Commit
        run: |
          git config user.name "playlists-bot"
          git config user.email "playlists-bot@users.noreply.github.com"
          git add tv.m3u music.m3u muzyka.m3u kino.m3u
          git diff --cached --quiet || (git commit -m "Плейлисты обновлены $(date -u +%Y-%m-%d)" && git push)
