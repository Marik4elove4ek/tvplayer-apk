name: ffvideo
# Сборка видеодекодера FFmpeg (liblupovideo.so) для Lupo Player.
# Готовые библиотеки кладутся в ветку ffvideo-out
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash ffvideo/build.sh
      - name: Publish to branch ffvideo-out
        run: |
          mkdir /tmp/out && cp -r ffvideo/out/jniLibs /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ffvideo-out
          git rm -rf . -q
          cp -r /tmp/out/jniLibs .
          git add jniLibs
          git commit -m "liblupovideo.so ($GITHUB_SHA)"
          git push -f origin ffvideo-out
