name: ffvideo
# Сборка видеодекодера FFmpeg (liblupovideo.so) для Lupo Player
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash ffvideo/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: ffvideo/out/jniLibs
